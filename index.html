                "name": "Wie wird der Kindesunterhalt im echten 50:50-Wechselmodell berechnet?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Im paritätischen Wechselmodell haften beide Elternteile nach § 1606 Abs. 3 S. 1 BGB anteilig nach ihren bereinigten Nettoeinkommen. Die Berechnung erfolgt nach dem 7-Schritte-Schema des BGH (XII ZB 565/15): 1. Bereinigung der Nettoeinkommen, 2. Bestimmung des Tabellenbedarfs nach kombiniertem Einkommen (Düsseldorfer Tabelle 2026), 3. Ermittlung der Haftungsquoten nach Abzug des angemessenen Selbstbehalts (1.750 €), 4. Abzug von 50 % Naturalunterhalt, 5. Quotenmäßige Verrechnung direkter Sachausgaben, 6. Zweistufiges Kindergeld-Splitting nach BGH XII ZB 45/15 (25 % Betreuungsanteil + quotenmäßiger 50 % Baranteil) und 7. Ermittlung des monatlichen Spitzabrechnungsbetrags."

                }
              },

                "@type": "Question",
                "name": "Wie wird das staatliche Kindergeld im Wechselmodell aufgeteilt?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Nach § 1612b BGB und dem Grundsatzbeschluss des BGH vom 20. April 2016 (Az. XII ZB 45/15) teilt sich das staatliche Kindergeld (2026: 259 € pro Monat und Kind) in zwei Komponenten auf: 1. Ein 50 %-iger Betreuungsanteil, der beiden Elternteilen zu gleichen Teilen zusteht (je 25 % fix und einkommensunabhängig = 64,75 €). 2. Ein 50 %-iger Baranteil (129,50 €), der den kindlichen Barbedarf mindert und nach den ermittelten Haftungsquoten (Q_A : Q_B) verrechnet wird. Jeder Elternteil hat Anspruch auf seinen 25 %-igen Betreuungsanteil plus eigene Barunterhaltsentlastung in Höhe seiner eigenen Haftungsquote (25 % KG + Q_eigen × 50 % KG). Der Auszahlungsempfänger leitet diesen Anspruch an den Nicht-Bezieher weiter: ΔKG_Bezieher = +(25 % KG + Q_Nicht-Bezieher × 50 % KG) bzw. ΔKG_Nicht-Bezieher = -(25 % KG + Q_eigen × 50 % KG). Ohne Gesamtabrechnung besteht ein sofortiger isolierter Mindestanspruch auf 25 % des Kindergeldes („Ein-Viertel-Regel\")."
