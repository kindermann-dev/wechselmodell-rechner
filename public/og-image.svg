<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Hintergrundverlauf -->
    <radialGradient id="bg-glow" cx="75%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#162544" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0c1424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>

    <!-- Oberer Akzentbalken -->
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Rahmen-Verläufe -->
    <linearGradient id="card-border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="main-box-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Schatten -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="630" fill="#070b14"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-line)"/>

  <!-- LINKE SPALTE: Hero & Badges -->
  <g transform="translate(68, 64)">
    <!-- Chips / Badges -->
    <g transform="translate(0, 0)">
      <!-- Badge 1: BGH-Urteil -->
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#0c233c" stroke="#0284c7" stroke-width="1.2"/>
      <text x="14" y="22" class="font-sans" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.3">BGH XII ZB 565/15</text>

      <!-- Badge 2: Düsseldorfer Tabelle 2026 (Exakt eingepasst) -->
      <rect x="180" y="0" width="180" height="34" rx="8" fill="#152033" stroke="#334155" stroke-width="1.2"/>
      <text x="194" y="22" class="font-sans" font-size="13" font-weight="500" fill="#94a3b8">Düsseldorfer Tabelle 2026</text>
    </g>

    <!-- Haupttitel -->
    <text x="0" y="112" class="font-sans" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.8">Kindesunterhalt</text>
    <text x="0" y="166" class="font-sans" font-size="46" font-weight="800" fill="#38bdf8" letter-spacing="-0.8">im Wechselmodell</text>

    <!-- Subtitle / Beschreibung -->
    <text x="0" y="226" class="font-sans" font-size="17" font-weight="400" fill="#94a3b8">
      <tspan x="0" dy="0">Open-Source-Rechner für paritätische 50:50-Betreuung:</tspan>
      <tspan x="0" dy="26">Quotenermittlung, Realkosten-Wohnmehrbedarf</tspan>
      <tspan x="0" dy="26">&amp; Kindergeldausgleich nach aktuellen Urteilen.</tspan>
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 332)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="250" height="40" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="25" class="font-sans" font-size="13.5" font-weight="600" fill="#38bdf8">✓</text>
        <text x="36" y="25" class="font-sans" font-size="13.5" font-weight="500" fill="#cbd5e1">7-Schritte-BGH-Schema</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="250" height="40" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="25" class="font-sans" font-size="13.5" font-weight="600" fill="#38bdf8">✓</text>
        <text x="36" y="25" class="font-sans" font-size="13.5" font-weight="500" fill="#cbd5e1">Wohnmehrbedarf</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="250" height="40" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="25" class="font-sans" font-size="13.5" font-weight="600" fill="#38bdf8">✓</text>
        <text x="36" y="25" class="font-sans" font-size="13.5" font-weight="500" fill="#cbd5e1">Zweistufiges Kindergeld-Splitting</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="250" height="40" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="25" class="font-sans" font-size="13.5" font-weight="600" fill="#38bdf8">✓</text>
        <text x="36" y="25" class="font-sans" font-size="13.5" font-weight="500" fill="#cbd5e1">Berechnung im Browser</text>
      </g>
    </g>
  </g>

  <!-- RECHTE SPALTE: Exakte Ausgleichsberechnung-Card -->
  <g transform="translate(605, 58)" filter="url(#card-shadow)">
    <!-- Äußerer Container -->
    <rect width="525" height="505" rx="16" fill="#0d1524" stroke="url(#card-border-glow)" stroke-width="1.2"/>

    <!-- Überschrift -->
    <text x="32" y="46" class="font-sans" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Ausgleichsberechnung</text>

    <!-- Große Box: Monatlicher Zahlungsanspruch -->
    <g transform="translate(28, 72)">
      <rect width="469" height="175" rx="12" fill="#0e1b2f" stroke="url(#main-box-border)" stroke-width="1.5" filter="url(#subtle-shadow)"/>
      
      <text x="234.5" y="42" class="font-sans" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="1.4">MONATLICHER ZAHLUNGSANSPRUCH</text>
      <text x="234.5" y="104" class="font-sans" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">295.61 €</text>
      <text x="234.5" y="142" class="font-sans" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Elternteil A zahlt an Elternteil B</text>
    </g>

    <!-- 2x2 Grid -->
    <g transform="translate(28, 263)">
      <!-- Row 1, Col 1: Kombiniertes Netto -->
      <g transform="translate(0, 0)">
        <rect width="226" height="102" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="30" class="font-sans" font-size="13" font-weight="500" fill="#94a3b8">Kombiniertes Netto</text>
        
        <circle cx="204" cy="25" r="8.5" fill="#1e293b"/>
        <text x="204" y="29" class="font-sans" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">?</text>
        
        <text x="18" y="68" class="font-sans" font-size="20" font-weight="700" fill="#ffffff">4840.00 €</text>
      </g>

      <!-- Row 1, Col 2: DT-Einstufung -->
      <g transform="translate(243, 0)">
        <rect width="226" height="102" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="30" class="font-sans" font-size="13" font-weight="500" fill="#94a3b8">DT-Einstufung</text>
        
        <circle cx="204" cy="25" r="8.5" fill="#1e293b"/>
        <text x="204" y="29" class="font-sans" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">?</text>
        
        <text x="18" y="68" class="font-sans" font-size="19" font-weight="700" fill="#ffffff">Gruppe 8 (144%)</text>
      </g>

      <!-- Row 2, Col 1: Haftungsquote A -->
      <g transform="translate(0, 116)">
        <rect width="226" height="102" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="30" class="font-sans" font-size="13" font-weight="500" fill="#94a3b8">Haftungsquote A</text>
        
        <circle cx="204" cy="25" r="8.5" fill="#1e293b"/>
        <text x="204" y="29" class="font-sans" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">?</text>
        
        <text x="18" y="68" class="font-sans" font-size="21" font-weight="700" fill="#ffffff">74.6 %</text>
      </g>

      <!-- Row 2, Col 2: Haftungsquote B -->
      <g transform="translate(243, 116)">
        <rect width="226" height="102" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="30" class="font-sans" font-size="13" font-weight="500" fill="#94a3b8">Haftungsquote B</text>
        
        <circle cx="204" cy="25" r="8.5" fill="#1e293b"/>
        <text x="204" y="29" class="font-sans" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">?</text>
        
        <text x="18" y="68" class="font-sans" font-size="21" font-weight="700" fill="#ffffff">25.4 %</text>
      </g>
    </g>
  </g>
</svg>
